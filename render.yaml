services:
  - type: web
    name: somnus-backend
    runtime: node
    # Free instance. Stated explicitly because a blueprint with no `plan` defaults to
    # a PAID one, and this project is a testnet demo that should cost nothing. The
    # trade-off is real and worth knowing: a free service sleeps after ~15 minutes
    # idle, so the first request after a nap takes about 50 seconds to answer while
    # the container wakes. Call it twice; the second is instant.
    #
    # The fix is an external uptime monitor (UptimeRobot or similar) hitting GET /ping
    # every 5 minutes. /ping is deliberately the cheapest route in the service — no
    # chain read, no RPC, no external API, nothing cached to miss. Do NOT point a
    # monitor at /api/health for this: health calls fetchSpotMarkets() for indexer
    # state on a 10s cache, which a 5-minute monitor misses every single time, turning
    # a keep-awake into a permanent external request against DreamDEX's API.
    plan: free
    # Build and start from the REPO ROOT, not from backend/. This repo is an npm
    # workspace: the lockfile lives at the root, so installing from the root is the
    # only way the deploy resolves the same dependency versions the tests ran
    # against. `npm start` at the root delegates to the backend workspace, which is
    # also the command the README documents — one path, exercised locally and in
    # production, rather than a deploy-only variant nobody runs until it breaks.
    #
    # Nothing in the runtime depends on the working directory: DATA_DIR and the .env
    # path are both resolved from the module's own location.
    #
    # `tsx` is a runtime dependency here, not a dev one — `npm start` executes
    # TypeScript directly. It sits in "dependencies" for that reason: a host that
    # installs with NODE_ENV=production would otherwise skip it and the service would
    # die at boot with "tsx: not found".
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NETWORK
        value: testnet
      - key: PORT
        value: 10000
      # server.ts binds 127.0.0.1 by default — correct for a laptop holding a key,
      # fatal here: a loopback-bound service fails its own health check and is
      # unreachable from outside the container. SOMNUS_API_KEY below is what makes
      # exposing it safe, and it is generated rather than optional for that reason.
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 20.19.0
      - key: DRY_RUN
        value: true
      - key: AGENT_MODE
        value: dry-run
      # Start the decision loop on boot.
      #
      # Off by default in the code, because a process that begins trading the moment it
      # starts is the wrong default for something holding a key. Here it is right, and
      # safe, precisely because DRY_RUN and AGENT_MODE above are dry-run: the loop
      # prices live windows every 60s, records every decision to the signed chain, and
      # sends nothing.
      #
      # Without this the hosted service is idle forever. Anyone visiting the URL sees
      # `loop: {running: false, cycles: 0}`, an empty proof chain, zero P&L, and
      # `blocked: ["no order book has ever been read successfully — the agent is
      # blind"]` — that last one being literally true of a service nobody has asked for
      # a book yet. Nothing is broken in that state and all of it reads as broken.
      - key: AGENT_AUTOSTART
        value: true
      # Start from the operator's real, verifiable history instead of from nothing.
      #
      # The free tier has no persistent disk, so DATA_DIR is recreated with the container —
      # on every deploy AND on every wake from the idle spin-down. Without this the proof
      # chain is empty, which makes "prove it actually placed the trades it claims" answer
      # with a blank list, and the P&L record has nothing in it either.
      #
      # Copies backend/demo/*.seed.* into DATA_DIR at boot, and only when DATA_DIR has no
      # file of that name — so a container already running is never overwritten. The
      # shipped chain is 2,885 entries that verify from genesis: linkage OK, head matches,
      # 2,799 signatures valid, 86 historical entries unsigned and reported as such.
      #
      # A real disk is still the correct fix; see the commented block at the bottom.
      - key: SOMNUS_SEED_DEMO_DATA
        value: true
      # The address the shipped chain's signatures should recover to.
      #
      # This deployment holds NO private key — that is the point of the hosted surface. But
      # a verifier needs an address to check against, and without one /proof/verify could
      # only report `signaturesChecked: 0` on a chain that is in fact signed. An address
      # grants no authority; it is what a block explorer shows.
      - key: SOMNUS_PROOF_SIGNER
        value: "0xC2187C19bcD588E0eb68d68143Af5D410079C69a"
      - key: AGENT_MAX_TRADE_SIZE
        value: 50
      - key: AGENT_MAX_DAILY_LOSS
        value: 1000
      - key: SOMNUS_API_KEY
        generateValue: true
      # Per-user wallets on the public /mcp endpoint: a caller sends their own
      # x-somnus-token and gets a wallet derived from it (HMAC of this secret and
      # their token), which the agent's model then trades on their behalf.
      #
      # Generated, not committed — and generated ONCE per service. Recreating the
      # service mints a new secret, which silently re-points every caller at a new
      # empty wallet: acceptable only because these are faucet-funded testnet
      # balances. The derivation is custodial (this server can derive any token's
      # key), which is why the code refuses to do any of this on mainnet.
      - key: SOMNUS_USER_SECRET
        generateValue: true
      # Callers' confirmed trades reach the chain. Set to `simulate` to price and
      # record them without sending. Independent of DRY_RUN above, which governs
      # the operator's own wallet — this authorises spending from theirs.
      - key: SOMNUS_USER_TRADING
        value: live
      # Hard cap per caller trade, and per token per hour. No tool argument can
      # raise either. 1000 suits the faucet's 10,000 tUSDC drip — ten full-size
      # trades before a caller has to draw again.
      - key: SOMNUS_USER_MAX_TRADE
        value: 1000
      - key: SOMNUS_USER_TRADES_PER_HOUR
        value: 20
      # Each cached signing client holds a chain WebSocket, and a free instance has
      # 512MB to play with. Six is plenty for a demo — an evicted caller just pays for
      # a rebuilt client on their next call, which costs them nothing but a moment.
      - key: SOMNUS_MAX_USER_CLIENTS
        value: 6
      # A hosted agent nobody is watching needs somewhere to shout. Any endpoint
      # that accepts a JSON POST works; left unset, breakers still trip but silently.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
    autoDeploy: true
    # ── Persistent history (NOT enabled: needs a paid plan) ──────────────────────
    #
    # Without a disk, `backend/data/` lives in the container filesystem and is recreated
    # on every deploy. The proof chain, the P&L ledger and the measured calibration all
    # start from nothing each time — so the hosted service can never accumulate the
    # history that is the whole point of a signed audit trail. `calibration.seed.json` is
    # committed to the repo for exactly this reason, and it is a workaround, not a fix:
    # the chain and the ledger still reset.
    #
    # Render disks require a PAID instance. Render's own docs: "You can attach a
    # persistent disk to a paid Render web service, private service, or background
    # worker." The free tier is excluded, so uncommenting the block below while `plan:
    # free` is set above will fail the deploy — change the plan in the same edit.
    #
    # Two other consequences worth knowing before flipping it: a disk pins the service to
    # a single instance, and attaching one forfeits zero-downtime deploys (the old
    # container stops before the new one starts). Both are fine for this; neither is
    # reversible in the sense that disk capacity can be raised but never lowered.
    #
    #   plan: starter          # replaces `plan: free` above
    #   disk:
    #     name: somnus-data
    #     mountPath: /var/somnus-data
    #     sizeGB: 1
    #
    # and add, in envVars:
    #
    #   - key: DATA_DIR
    #     value: /var/somnus-data
    #
    # DATA_DIR is read straight from the environment (backend/src/config.ts), so pointing
    # it at the mount is the only wiring needed.

